# Netlify deployment — mirrors vercel.json.
# Note: middleware.ts (crawler prerender for the public site) is Vercel-only
# and does not run on Netlify. The app itself is unaffected.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Real files (assets, sw.js, manifest.json, sitemap.xml, ...) are served first;
# these rules only apply when no file matches.
[[redirects]]
  from = "/db-migrate"
  to = "/db-migrate.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
